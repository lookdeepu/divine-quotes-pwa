<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6750A4"/>
      <stop offset="100%" stop-color="#381E72"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Halo / Sunburst Ring -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35" stroke-dasharray="8 8"/>
  <circle cx="256" cy="230" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Open Sacred Book Silhouette -->
  <path d="M256 310 C210 275 140 275 90 290 L90 190 C140 175 210 175 256 210 C302 175 372 175 422 190 L422 290 C372 275 302 275 256 310 Z"
        fill="#FFFFFF" opacity="0.95"/>
  <path d="M256 210 L256 310" stroke="#6750A4" stroke-width="4" stroke-linecap="round"/>

  <!-- Divine Flame above the Book -->
  <path d="M256 120 C240 155 220 180 220 205 C220 228 236 245 256 245 C276 245 292 228 292 205 C292 180 272 155 256 120 Z"
        fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Flame Core -->
  <path d="M256 155 C248 175 240 190 240 205 C240 216 247 225 256 225 C265 225 272 216 272 205 C272 190 264 175 256 155 Z"
        fill="#FFFFFF" opacity="0.9"/>

  <!-- Bottom Sacred Stars / Dots -->
  <circle cx="196" cy="360" r="6" fill="url(#goldGrad)"/>
  <circle cx="256" cy="370" r="8" fill="url(#goldGrad)"/>
  <circle cx="316" cy="360" r="6" fill="url(#goldGrad)"/>
</svg>
